[package]
name = "hegel-core"
version = "0.1.0"
edition = "2024"
description = "Protocol, model, connection, config, discovery and mock for Hegel amplifiers (no GUI dependencies)"

[lib]
name = "hegel_core"
path = "src/lib.rs"

[[bin]]
name = "mock_amp"
path = "src/bin/mock_amp.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
futures = "0.3"
log = "0.4"
